# Market-impact probe: how much does one order of size q actually cost?
#
# ======================================================================
# CRITERIA WRITTEN BEFORE THE RUN. DO NOT CHANGE AFTERWARDS.
# ======================================================================
# Locked in on 2026-09-29, before evaluation/impact_probe.py was ever run over
# the full seed range. The only numbers that existed were an 8-seed pilot on
# development seeds 1000-1007, quoted under `pilot:` below for the record.
#
# Why this probe exists
# ---------------------
# Stage 0 found the environment flat: four different schedules all tied with
# TWAP. The diagnosis was that 100-share child orders do not move a ~$1000 stock,
# so the whole cost being optimised is one tick of spread, identical for every
# schedule. This probe measures that directly and picks an order size at which
# execution cost is material.

method:
  name: "twin days"
  description: >
    For each seed, run the SAME market day twice: a baseline arm that holds every
    step, and a probe arm that sends one market sell of size q at the first step
    and then holds. Because a seed replays a day exactly, the paired difference
    in mid price at each step is caused only by our order.

  validity_proof: >
    The kernel's own RNG is consumed in exactly one place, kernel.py:589, inside
    the branch taken only when agent_latency_model is None. rmsc04 sets a latency
    model (rmsc04.py:272) and core_environment.py:82-95 forwards it to the
    Kernel, so sending one extra order cannot shift any random stream. Background
    agents hold their own RandomState, so divergence between arms is causal, not
    contamination. Confirmed empirically: entry_price is identical across arms on
    every seed tested.

  baseline_is_shared: true
  baseline_invariance_note: >
    The baseline arm sends no orders, so parent_order_size and order_fixed_size
    affect only normalisation, never the simulation. Verified on 3 seeds:
    max |mid difference| between q=100 and q=1000 baselines was exactly
    0.0000000000. The baseline is therefore run ONCE per seed instead of once per
    (q, seed), cutting the run from 800 to 500 episodes. impact_probe.py
    re-verifies this at runtime on the first few seeds rather than trusting it.

probe:
  order_sizes: [100, 300, 1000, 3000]
  seeds:
    start: 1000
    end: 1099                      # 100 market days, development_new band
  env_variant: "variable_last_child"
  parent_order_size_multiplier: 10  # parent = 10*q, so one order cannot finish
                                    # the parent order and the episode stays
                                    # alive for the whole window
  direction: "SELL"

  base_config: "configs/gate_d_varchild.yaml"
  overrides:
    order_fixed_size: "q"
    parent_order_size: "10*q"

  note_on_terminal_penalty: >
    The episode always ends with 90% of the parent order unexecuted, so
    not_enough_reward_update dominates the reward. That is deliberate and
    harmless: this probe never reads reward. Execution cost is computed from the
    probe order's own fills, and impact from the paired mid difference.

# ----------------------------------------------------------------------
# What gets recorded, per (q, seed)
# ----------------------------------------------------------------------
records:
  - fill_quantity                  # shares actually filled by the probe order
  - fill_rate                      # fill_quantity / q
  - avg_fill_price                 # quantity-weighted, from parsed_episode_executed_orders
  - entry_price                    # arrival mid, env.unwrapped.entry_price
  - cost_bps_from_fills            # (entry - avg_fill) / entry * 1e4, SELL
  - cost_bps_from_reward           # same quantity via info["slippage_reward"]; cross-check
  - spread_at_arrival              # observation[6, 0] at reset, before the order
  - bid_depth_l1 .. bid_depth_l5   # shares resting at each of the top 5 bid levels
  - bid_depth_l1_5_total
  - mid_diff_step_0 .. mid_diff_step_9   # paired (probe - baseline) mid, in bps of
                                         # the arrival price so days at different
                                         # price levels compare; multiply by
                                         # entry_price/1e4 for price units

# ======================================================================
# PASS CRITERIA - "impact is material"
# ======================================================================
criteria:

  # PRIMARY, decisive. Measures what the order actually paid, which is exactly
  # what Implementation Shortfall charges. Needs no baseline arm, so it carries
  # none of the twin-day divergence noise.
  primary:
    rule: >
      Choose the SMALLEST q that satisfies BOTH conditions. If none does, no
      tested size makes impact material and the size grid must be widened.
    min_median_cost_bps: 0.15
    min_median_fill_rate: 0.95
    half_spread_bps_reference: 0.05
    justification: >
      The spread is 1 tick (1 cent) about 70% of the time on a ~100,137-cent
      stock, so the half-spread is 0.5/100137*1e4 = 0.05 bps. The 0.15 bps bar is
      3x that, which is the "3x half-spread" test from the Stage-3 brief. The fill
      bar prevents choosing a size the book cannot absorb, where measured cost is
      flattered because the unfilled remainder is discarded rather than rested
      (order_book.py:190-192).

  # SECONDARY, reported but never decisive.
  secondary:
    report:
      - "paired mid impact at every step: median and IQR"
      - "decay from step 0 to step 9"
      - "bid depth distribution at arrival"
    why_not_decisive: >
      The Stage-3 brief proposed gating on the paired impact at the END of the
      window. The pilot shows that measure does not behave: at q=1000 the step-9
      difference flips sign across seeds (-3.50, +2.75, +1.00, -2.20, -3.50,
      -2.90), and q=100's step-9 median (-0.55) is within a factor of 5 of
      q=1000's (-2.55) despite a 10x size difference. Late steps are dominated by
      chaotic amplification through the background agents rather than by order
      size. Additionally q=1000 moves -0.35 bps at step 0 but only -0.05 by
      step 1: the book refills within the 60-second wakeup interval, so a
      minute-granularity mid difference mostly misses the impact it is meant to
      capture.

# ----------------------------------------------------------------------
# Pilot, 8 seeds (1000-1007), recorded BEFORE the full run for the record.
# These are NOT the result; the full run either confirms them or does not.
# ----------------------------------------------------------------------
pilot:
  note: "median execution cost vs arrival mid, and median fill rate"
  q_100:   {cost_median_bps: 0.034, fill_rate_median: 1.000}
  q_300:   {cost_median_bps: 0.073, fill_rate_median: 1.000}
  q_1000:  {cost_median_bps: 0.848, fill_rate_median: 1.000}
  q_3000:  {cost_median_bps: 2.007, fill_rate_median: 0.596}
  q_10000: {cost_median_bps: 2.065, fill_rate_median: 0.179}
  bid_depth_l1_5_seed_1000: 559
  expectation: >
    On the pilot the primary criterion selects q = 1000: it is the smallest size
    clearing 0.15 bps while still filling 100%. q=300 fails the cost bar and
    q=3000 fails the fill bar. Stated here in advance so the full run tests a
    prediction rather than fishes for one.
